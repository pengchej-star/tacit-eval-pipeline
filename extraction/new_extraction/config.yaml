# new_extraction: implementation of "3a Extraction" (Tacit_new.pdf, Envisioned implementation), steps 1-8.
litellm:
  api_base: https://ai-gateway.andrew.cmu.edu/
  prefix: openai/
model:
  generator: wine-claude-sonnet-4-6      # default for every stage not listed under stage_models
  max_tokens: 4000
  temperature: 0.3
  timeout_s: 600
  max_retries: 5
  workers: 32                            # the proxy took 64 parallel calls without errors or slower replies in a test
stage_models:                            # stages that use a different (stronger) model
  desiderata: wine-claude-opus-4-6       # step 4: what to ask at each decision (quality drives everything after it)
  visits: wine-claude-opus-4-6           # step 5: evidence reconstruction for every edit, and the merging of proposed new checks
embedding:
  model: wine-text-embedding-3-large
  batch: 128
paths:                                   # all inputs ship in data/ (see tools/build_data.py for how they were derived)
  actions: data/actions.parquet          # TraceML action labels + goal + change summary per version transition (human experts)
  scores: data/scores.json               # {kernel id: {version: public leaderboard score}}
  selection: data/selection.csv          # the top experts per competition, ranked by best public score
  episode_items: data/episode_items.jsonl   # episode mode: instance + general rationale items per episode
  skeleton: data/topdown_skeleton.json   # the top-down tree used for the reported run; regenerated by the LLM if the file is missing
  out: out                               # results go to out/pooled_<mode>[_<suffix>]/
  notebooks: null                        # optional: TraceML's human/ folder (<key_id>/versions/vNNN.ipynb); step 5 then also shows the notebook at v_old
scope:
  comps: null                            # null = every competition in tasks.yaml (override: run.py --comps a,b)
  n_experts: 10                          # per competition: first 10 of selection.csv by rank (best public score)
items:
  mode: episode                          # episode: episode_items.jsonl "general" items (cluster on the general action)
                                         # label:   TraceML action labels + change summary, one item per version transition
  trivial_labels: [housekeeping, infra, cosmetic, noop]   # label mode: fine labels under these coarse parents are plumbing and ignored; an edit with no other label is trivial
context:                                 # prompt limits (chars)
  history_max: 6000                      # earlier edits of the same expert (goal + change summary + score)
  code_max: 14000                        # step 5: the notebook at v_old, cut to this many chars (only when paths.notebooks is set)
cluster:
  action_target_ratio: 2.5               # level 0: n_items / ratio clusters
  level_ratio: 3.0                       # higher levels: k / ratio clusters
  root_k: 6                              # stop clustering when <= this many clusters remain, then add the root
  auto_merge: [0.10, 0.15]               # cosine distance below which two clusters merge without asking the LLM (level 0, higher levels)
  max_dist: [0.38, 0.60]                 # above this distance two clusters are never merged (level 0, higher levels); level 0 was 0.30 (Nov 7: 35% of items had no neighbour within 0.30)
  max_levels: 5
  pair_batch: 8                          # pairs judged per LLM call
  name_batch: 8                          # level-0 groups named per LLM call
  review_low_conf: true                  # LLM pass over clusters that contain low-confidence merges
topdown:
  depth: 4
visits:
  masked: true                           # step 5 mode. true (Nov 7): one call per (edit, decision node); the LLM is NOT shown the option taken, the edit's own
                                         #   goal/labels/summary, or the episode item; checks are shuffled; the notebook at v_old is added when paths.notebooks is set.
                                         #   Caches: 5_visits_masked_r1/r2.jsonl, 4b_new_checks_masked.jsonl. About 4x the calls of false.
                                         # false: the Nov 4 annotation, unchanged: one call per edit, with the walk, the option taken, the edit summary and the items.
                                         #   Caches: 5_visits_r1/r2.jsonl, 4b_new_checks.jsonl. Cheaper, but the answers lean toward the option taken.
  new_checks: true                       # the LLM may propose checks missing from the node's desiderata; they are merged in and the affected edits re-annotated
scores:
  temperature: 0.5                       # softmax temperature of ranking_now (hand-set)
  min_visits: 4                          # nodes with fewer visits get no enough-threshold
# Task slots: every prompt takes its task-specific wording from here (placeholders <<name>>), so the same prompts serve another task.
task:
  domain: "a supervised-learning Kaggle competition" 
  actor: "expert practitioner"
  artifact: "notebook"
  edit: "version-to-version edit"
  objective: "improve the score of the solution"
  root_name: "Get a better score"
  progress_signal: "leaderboard score"
  areas: "measurement/validation, data & input, architecture, training, loss/objective, inference/post-processing, ensembling, compute/efficiency"
  evidence_sources: "scores and their trend, training curves, error analysis, the summaries of earlier changes, compute budget/time, what was already tried, what public solutions do"
  # examples used inside prompts to show the expected granularity (swap them for the new task)
  example_action: "lower the learning rate"
  example_action_2: "use a cosine schedule"
  example_decision: "how to tune the optimization"
  example_question: "which part to change?"
  example_label: "increase input resolution"
  example_branch_1: "optimization knobs"
  example_branch_2: "how predictions are post-processed"
